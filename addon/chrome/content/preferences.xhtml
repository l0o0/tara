<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="zotero-prefpane-__addonRef__"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', {window})"
>
  <groupbox>
    <label><html:h2 data-l10n-id="caption-label"></html:h2></label>
    <checkbox
      id="zotero-prefpane-__addonRef__-keepAddons"
      preference="__prefsPrefix__.keepAddons"
      data-l10n-id="keepAddons-label"
      native="true"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-keepPrefs"
      preference="__prefsPrefix__.keepPrefs"
      data-l10n-id="keepPrefs-label"
      native="true"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-keepStyles"
      preference="__prefsPrefix__.keepStyles"
      data-l10n-id="keepStyles-label"
      native="true"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-keepTranslators"
      preference="__prefsPrefix__.keepTranslators"
      data-l10n-id="keepTranslators-label"
      native="true"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-keepLocate"
      preference="__prefsPrefix__.keepLocate"
      data-l10n-id="keepLocate-label"
      native="true"
    />

    <hbox style="display: flex; align-items: center">
      <html:label data-l10n-id="choose-exportDir"></html:label>
      <html:input
        style="flex: 1"
        type="text"
        id="tara-exportDir"
        preference="__prefsPrefix__.exportDir"
      ></html:input>
      <button
        data-l10n-id="choose"
        id="tara-choose-folder-button"
        native="true"
      />
    </hbox>
  </groupbox>
</vbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
